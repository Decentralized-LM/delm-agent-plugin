<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>DeLM for Claude Code and Codex</title>
    <style>
@font-face {
  font-family: Geist;
  src: url("assets/fonts/Geist-Regular.woff2") format("woff2");
  font-weight: 400;
  font-display: block;
}
@font-face {
  font-family: Geist;
  src: url("assets/fonts/Geist-Medium.woff2") format("woff2");
  font-weight: 500;
  font-display: block;
}
@font-face {
  font-family: Geist;
  src: url("assets/fonts/Geist-SemiBold.woff2") format("woff2");
  font-weight: 600;
  font-display: block;
}
/* SF Mono matches the native Terminal. It is cached locally and never redistributed. */
@font-face {
  font-family: "Terminal Mono";
  src: url(".cache/fonts/SF-Mono-Regular.otf") format("opentype");
  font-weight: 400;
  font-display: block;
}
@font-face {
  font-family: "Terminal Mono";
  src: url(".cache/fonts/SF-Mono-Bold.otf") format("opentype");
  font-weight: 700;
  font-display: block;
}

:root {
  --ink: #181a20;
  --blue: #315ee8;
  --claude: #d97757;
  --term: #181818;
  --pane: #262626;
  --text: #d5d5d5;
  --dim: #999999;
  --board-blue: #6b8fff;
  --suggest: #b1b9f9;
  --ok: #4eba65;
  --mono: "Terminal Mono", Menlo, "Apple Symbols", monospace;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  overflow: hidden;
  background: #f5f5f2;
}
body {
  font-family: Geist, sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
/* Fixed composition size: the renderer's viewport can be shorter than 1080. */
#film {
  width: 1920px;
  height: 1080px;
  position: relative;
  overflow: hidden;
}
.paper {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 48% 10%, #fff 0%, #f8f8f5 50%, #eceeec 100%);
}
.scene {
  position: absolute;
  inset: 0;
  opacity: 0;
}

/* Mascots: vector art with waving arms, blinking eyes, and a gentle bob. */
.pet svg,
.perched svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.clawd-wave-arm {
  transform-origin: 166px 136px;
}
.codex-wave-arm {
  transform-origin: 127px 148px;
}
.clawd-eyes,
.codex-eyes {
  transform-box: fill-box;
  transform-origin: center;
}

/* Title: "DeLM for" stays still while the host name turns like a wheel. */
#cover {
  position: absolute;
  inset: 0;
}
#cover-title {
  position: absolute;
  left: 0;
  right: 0;
  top: 330px;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  font: 500 112px/1 Geist, sans-serif;
  letter-spacing: -5px;
  white-space: nowrap;
}
.cover-brand {
  color: var(--blue);
}
.cover-for {
  margin-left: 30px;
}
#host-slot {
  position: relative;
  display: block;
  height: 200px;
  margin-left: 30px;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(transparent 0, #000 14%, #000 86%, transparent 100%);
  mask-image: linear-gradient(transparent 0, #000 14%, #000 86%, transparent 100%);
}
.host {
  position: absolute;
  left: 0;
  top: 0;
  height: 200px;
  display: flex;
  align-items: center;
}
#host-claude .host-name {
  color: var(--claude);
}
#host-codex .host-name {
  color: var(--ink);
}
/* Each mascot stands on the title's baseline. */
.host .pet {
  position: relative;
  display: block;
  flex: 0 0 auto;
  width: 180px;
  height: 195px;
  margin-left: 14px;
}
#host-claude .pet {
  top: -49px;
}
#host-codex .pet {
  width: 140px;
  height: 152px;
  top: -27px;
}
.install-copy {
  position: absolute;
  left: 0;
  right: 0;
  top: 612px;
  width: max-content;
  margin-inline: auto;
  display: flex;
  align-items: center;
  gap: 36px;
  height: 78px;
  padding: 0 24px 0 30px;
  background: white;
  border: 1px solid #d9dce2;
  border-radius: 13px;
  box-shadow: 0 5px 14px #242a3610;
  font: 27px var(--mono);
}
.copy-command {
  letter-spacing: -1px;
}
.copy-icon {
  display: block;
  width: 24px;
  height: 24px;
}
.copy-icon svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: #656b75;
  stroke-width: 1.7;
}

.opening-title {
  position: absolute;
  left: 0;
  right: 0;
  top: 118px;
  text-align: center;
  font-size: 82px;
  line-height: 1.12;
  font-weight: 500;
  letter-spacing: -4.4px;
  opacity: 0;
}
.opening-title span {
  color: var(--blue);
}

/* One dark terminal window carries installation, Claude Code, and the agents. */
#camera {
  position: absolute;
  inset: 0;
  transform-origin: 0 0;
}
#term-rig {
  position: absolute;
  left: 320px;
  top: 255px;
  width: 1280px;
  height: 700px;
  perspective: 3400px;
  opacity: 0;
}
.window {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 15px;
  overflow: hidden;
  transform-origin: 50% 50%;
}
#term {
  background: var(--term);
  border: 1px solid #0b0b0b;
  box-shadow:
    0 0 0 1px #ffffff1c inset,
    0 60px 90px -40px #0d121c80,
    0 22px 40px -22px #0d121c66;
}
#term .window-bar {
  position: relative;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: #2b2b2b;
  border-bottom: 1px solid #0d0d0d;
  color: #a5a5a5;
  font: 500 16px Geist, sans-serif;
  letter-spacing: -0.1px;
}
.traffic {
  display: flex;
  gap: 9px;
  width: 80px;
}
.traffic i {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #ff5f57;
  box-shadow: inset 0 0 0 0.5px #00000030;
}
.traffic i:nth-child(2) {
  background: #febc2e;
}
.traffic i:nth-child(3) {
  background: #28c840;
}
.bar-spacer {
  width: 80px;
}
.term-content {
  position: absolute;
  inset: 44px 0 0;
  font-family: var(--mono);
  color: var(--text);
}

#install-screen {
  padding: 30px 40px;
  font-size: 23px;
  line-height: 34px;
  overflow: hidden;
}
#install-lines {
  position: relative;
}
.install-line {
  height: 34px;
  white-space: pre;
}
.install-line .path,
.install-line .ok {
  color: #5fb28a;
}
.install-line .prompt-symbol,
.install-line .spin {
  color: #8d8d8d;
}
.install-line .brand {
  color: var(--board-blue);
  font-weight: 700;
}
.install-line .ready {
  color: #fff;
  font-weight: 700;
}
.install-line.logo {
  color: var(--board-blue);
  height: 26px;
  line-height: 26px;
}
.install-line .typed-caret,
.caret {
  display: inline-block;
  width: 1ch;
  height: 1.15em;
  background: #e8e8e8;
  vertical-align: -0.2em;
}

#claude-screen {
  right: auto;
  bottom: auto;
  width: 1728px;
  height: 876px;
  transform-origin: 0 0;
  padding: 18px 24px;
  font-size: 21px;
  line-height: 28px;
  opacity: 0;
}
#claude-rows,
#board-rows {
  position: absolute;
  inset: 0;
}
#claude-rows {
  inset: 18px 24px;
}
.row {
  position: absolute;
  left: 0;
  right: 0;
  height: 28px;
  white-space: pre;
}
.row > span {
  position: absolute;
  top: 0;
}
.row .fill {
  height: 28px;
}
.row .caret {
  top: 3px;
  height: 22px;
  width: 1ch;
  background: #e6e6e6;
}
.claude-logo {
  position: absolute;
  left: 0;
  top: 0;
  width: 10ch;
  height: 84px;
}
.bright {
  color: #ffffff;
}
.bold {
  font-weight: 700;
}
.dim {
  color: var(--dim);
}
.blue {
  color: var(--board-blue);
}
.suggest,
.key {
  color: var(--suggest);
}
.ok {
  color: var(--ok);
}
.bad {
  color: #ff6b6b;
}
.divider {
  color: #6f6f6f;
}
.rule {
  position: absolute;
  left: 0;
  right: 0;
  height: 1px;
  background: #888888;
}
#board {
  position: absolute;
  top: 18px;
  left: calc(24px + 71ch);
  right: 24px;
  height: calc(26 * 28px);
  background: var(--pane);
  opacity: 0;
}

/* Each agent's live work, side by side under the conversation. */
.agent {
  position: absolute;
  top: 326px;
  width: 430px;
  height: 386px;
  border: 1px solid #575757;
  border-radius: 10px;
  background: #1c1c1c;
  box-shadow: 0 14px 30px -18px #000;
  opacity: 0;
}
#agent-1 {
  left: 36px;
}
#agent-2 {
  left: 482px;
}
.agent-rows {
  position: absolute;
  inset: 10px 14px;
}
.agent .code {
  background: rgba(78, 186, 101, 0.14);
}
.agent .code.bad-line {
  background: rgba(255, 107, 107, 0.14);
}
.agent-preview {
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: 14px;
  height: 160px;
}
.preview-label {
  height: 24px;
  font-size: 17px;
  line-height: 20px;
  color: var(--dim);
}
.agent-preview canvas {
  display: block;
  width: 100%;
  height: 128px;
  margin-top: 8px;
  border-radius: 7px;
  box-shadow: 0 0 0 1px #2d3a55;
}
#routes {
  position: absolute;
  left: 0;
  top: 0;
  width: 1728px;
  height: 876px;
  overflow: visible;
  pointer-events: none;
}
.route-label rect {
  fill: #141a2e;
  stroke: var(--board-blue);
  stroke-width: 1.4;
}
.route-label text {
  font: 500 17px Geist, sans-serif;
  fill: #aec0ff;
}

/* The finished game, shown large against a synthwave night. */
#game-backdrop {
  position: absolute;
  inset: 0;
  opacity: 0;
  background: radial-gradient(ellipse at 50% 62%, #241a52 0%, #0d1229 46%, #05070f 100%);
}
#game {
  position: absolute;
  left: 80px;
  top: 45px;
  width: 1760px;
  height: 990px;
  border-radius: 18px;
  overflow: hidden;
  background: #070b18;
  opacity: 0;
  transform-origin: 50% 50%;
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.09),
    0 40px 120px -24px rgba(110, 80, 230, 0.5),
    0 30px 60px -30px #000;
}
#game-footage {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
/* Callouts tie each agent's work to what the game is doing. */
.callout {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 22px 12px 13px;
  border-radius: 16px;
  background: rgba(11, 15, 30, 0.88);
  border: 1px solid rgba(107, 143, 255, 0.6);
  box-shadow: 0 14px 34px -12px #000, 0 0 24px -6px rgba(107, 143, 255, 0.45);
  font: 500 27px/1 Geist, sans-serif;
  letter-spacing: -0.4px;
  color: #eef2ff;
  white-space: nowrap;
  opacity: 0;
}
.callout .badge {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--board-blue);
  color: #0b1022;
  font: 600 19px/1 Geist, sans-serif;
}
.callout .who {
  color: #a9bcff;
}
.callout::before {
  content: "";
  position: absolute;
  top: -8px;
  left: var(--caret, 50%);
  width: 14px;
  height: 14px;
  margin-left: -7px;
  background: rgba(11, 15, 30, 0.88);
  border-left: 1px solid rgba(107, 143, 255, 0.6);
  border-top: 1px solid rgba(107, 143, 255, 0.6);
  transform: rotate(45deg);
}
/* Under the cube, on the empty floor of the level. */
#callout-1 {
  left: 529px;
  top: 790px;
}
/* Under the tempo readout in the top right. */
#callout-2 {
  right: 92px;
  top: 214px;
  --caret: calc(100% - 62px);
}

/* Closing: the original layout, unchanged. */
.closing {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 340px;
}
#closing-title {
  font-size: 98px;
  line-height: 1.05;
  font-weight: 500;
  letter-spacing: -5.5px;
  text-align: center;
  margin: 0;
}
#closing-command {
  font:
    31px "Terminal Mono",
    monospace;
  letter-spacing: -1.2px;
  background: #fff;
  border: 1px solid #dce0e7;
  border-radius: 10px;
  box-shadow: 0 8px 18px -8px #132a5420;
  padding: 22px 33px;
  color: #315ee8;
}
#closing-command > span {
  color: #8892a2;
  margin-right: 10px;
}
.closing-caret {
  display: inline-block;
  height: 30px;
  width: 14px;
  background: #315ee8;
  vertical-align: -5px;
  margin-left: 4px;
}
#closing-title .closing-line { display: inline-block; color: #181a20; }
#closing-with { position: relative; margin: 18px 0 72px; font: 500 98px/1.05 Geist, sans-serif; letter-spacing: -5.5px; white-space: pre; }
.closing-with-size { visibility: hidden; }
.closing-with-text { position: absolute; inset: 0; }
#closing-with-fast, #closing-with-brand { color: #315ee8; }
#closing-with-caret { display: none; width: 3px; height: 83px; background: #315ee8; margin-left: 8px; vertical-align: -10px; }

/* The two mascots stand on the command. They are positioned out of flow. */
#closing-command {
  position: relative;
}
#closing-command > .perched {
  position: absolute;
  bottom: calc(100% - 4px);
  width: 78px;
  height: 84px;
  margin: 0;
  opacity: 0;
}
#closing-clawd {
  left: 14px;
}
#closing-codex {
  right: 18px;
}

#pointer {
  position: absolute;
  width: 38px;
  height: 47px;
  top: 0;
  left: 0;
  filter: drop-shadow(0 3px 2px #0003);
  z-index: 50;
  opacity: 0;
}

</style>
  </head>
  <body>
    <div
      id="film"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-duration="55.2"
      data-fps="60"
    >
      <div class="paper"></div>

      <div id="cover">
        <div id="cover-title">
          <span class="cover-brand">DeLM</span><span class="cover-for">for</span
          ><span id="host-slot"
            ><span id="host-claude" class="host"
              ><span class="host-name">Claude Code</span><span class="pet"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 208" width="192" height="208" class="mascot mascot-clawd">
  <!-- Proportions follow Claude Code's terminal mascot: a 13 x 4 body of half cells,
       eyes one cell in from each side, arms on the third row, and four legs in pairs. -->
  <defs>
    <linearGradient id="clawd-skin" gradientUnits="userSpaceOnUse" x1="0" y1="74" x2="0" y2="198">
      <stop offset="0" stop-color="#eb8f6f"/>
      <stop offset=".35" stop-color="#d97757"/>
      <stop offset=".8" stop-color="#cc6a4b"/>
      <stop offset="1" stop-color="#bf5e41"/>
    </linearGradient>
    <radialGradient id="clawd-volume" gradientUnits="userSpaceOnUse" cx="90" cy="108" r="100">
      <stop offset=".55" stop-color="#7a2410" stop-opacity="0"/>
      <stop offset="1" stop-color="#7a2410" stop-opacity=".3"/>
    </radialGradient>
    <linearGradient id="clawd-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="clawd-ground" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3a2018" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3a2018" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="96" cy="201" rx="80" ry="5.5" fill="url(#clawd-ground)"/>
  <g class="clawd-figure">
    <!-- Outline pass, then fills. -->
    <g stroke="#2a1510" stroke-width="6" stroke-linejoin="round" fill="#2a1510">
      <rect x="24" y="166" width="11" height="32" rx="3.5"/>
      <rect x="46" y="166" width="11" height="32" rx="3.5"/>
      <rect x="135" y="166" width="11" height="32" rx="3.5"/>
      <rect x="157" y="166" width="11" height="32" rx="3.5"/>
      <rect x="2" y="124" width="26" height="24" rx="4"/>
      <g class="clawd-wave-rest"><g class="clawd-wave-arm"><rect x="164" y="124" width="26" height="24" rx="4"/></g></g>
      <rect x="24" y="76" width="144" height="96" rx="10"/>
    </g>
    <g fill="url(#clawd-skin)">
      <rect x="24" y="166" width="11" height="32" rx="3.5"/>
      <rect x="46" y="166" width="11" height="32" rx="3.5"/>
      <rect x="135" y="166" width="11" height="32" rx="3.5"/>
      <rect x="157" y="166" width="11" height="32" rx="3.5"/>
      <rect x="2" y="124" width="26" height="24" rx="4"/>
      <g class="clawd-wave-rest"><g class="clawd-wave-arm"><rect x="164" y="124" width="26" height="24" rx="4"/></g></g>
    </g>
    <g fill="#7a2410" opacity=".22">
      <rect x="24" y="186" width="11" height="12" rx="3.5"/><rect x="46" y="186" width="11" height="12" rx="3.5"/>
      <rect x="135" y="186" width="11" height="12" rx="3.5"/><rect x="157" y="186" width="11" height="12" rx="3.5"/>
    </g>
    <rect x="24" y="76" width="144" height="96" rx="10" fill="url(#clawd-skin)"/>
    <rect x="24" y="76" width="144" height="96" rx="10" fill="url(#clawd-volume)"/>
    <!-- A soft top light and a crisp rim, without turning the block into a pill. -->
    <rect x="31" y="81" width="130" height="26" rx="7" fill="url(#clawd-sheen)"/>
    <path d="M30 92v-4a7 7 0 0 1 7-7h118" fill="none" stroke="#ffd2bf" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
    <circle cx="38" cy="88" r="2.6" fill="#fff" opacity=".9"/>
    <path d="M34 166h124" fill="none" stroke="#f0a07f" stroke-width="2" stroke-linecap="round" opacity=".4"/>
    <!-- Eyes: tall and narrow, set high and in from each side. -->
    <g class="clawd-eyes">
      <rect x="46" y="100" width="11" height="24" rx="2.6" fill="#1d120e"/>
      <rect x="135" y="100" width="11" height="24" rx="2.6" fill="#1d120e"/>
      <rect x="48" y="103" width="3.6" height="5" rx="1.4" fill="#fff" opacity=".92"/>
      <rect x="137" y="103" width="3.6" height="5" rx="1.4" fill="#fff" opacity=".92"/>
    </g>
    <!-- While waving, the arm is drawn in front of the body. -->
    <g class="clawd-wave-front" opacity="0">
      <g class="clawd-wave-arm">
        <rect x="164" y="124" width="26" height="24" rx="4" fill="#2a1510" stroke="#2a1510" stroke-width="6" stroke-linejoin="round"/>
        <rect x="164" y="124" width="26" height="24" rx="4" fill="url(#clawd-skin)"/>
        <rect x="167" y="127" width="17" height="6" rx="3" fill="#fff" opacity=".3"/>
      </g>
    </g>
  </g>
</svg></span></span
            ><span id="host-codex" class="host"
              ><span class="host-name">Codex</span><span class="pet"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 208" width="192" height="208" class="mascot mascot-codex">
  <defs>
    <linearGradient id="codex-skin" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="0" y2="200">
      <stop offset="0" stop-color="#a4c1ff"/>
      <stop offset=".2" stop-color="#7ba5fb"/>
      <stop offset=".48" stop-color="#6190f8"/>
      <stop offset=".78" stop-color="#4d76ef"/>
      <stop offset="1" stop-color="#3f60df"/>
    </linearGradient>
    <radialGradient id="codex-volume" gradientUnits="userSpaceOnUse" cx="104" cy="66" r="104">
      <stop offset=".5" stop-color="#1a2a9e" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a2a9e" stop-opacity=".5"/>
    </radialGradient>
    <radialGradient id="codex-body-volume" gradientUnits="userSpaceOnUse" cx="90" cy="146" r="48">
      <stop offset=".45" stop-color="#1a2a9e" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a2a9e" stop-opacity=".45"/>
    </radialGradient>
    <radialGradient id="codex-gloss" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="codex-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303d8a"/>

    if (canvas.height !== HEIGHT * density) canvas.height = HEIGHT * density;

    background.addColorStop(0.7, "#101b33");
    background.addColorStop(1, "#080e1c");

    glow.addColorStop(0, "#45edff00");

        seg(30, description.length > room ? `${description.slice(0, room - 1)}…` : description, "suggest")));
    } else {
      html.push(row(29, seg(2, t >= claude.reply ? "? for shortcuts · ← for agents" : "? for shortcuts", "dim")));
    }
    rows.innerHTML = html.join("");
  }

  function boardRowsAt(t) {
    const html = [];
    const { phase, agents, tasks, shared } = boardState(t);
    const { sharedHeader } = boardLayout(t);
    const text = 2;
    for (let index = 0; index < PANE_ROWS; index++) html.push(row(index, seg(0, "│", "divider")));
    html.push(row(0, seg(COLUMNS - LEFT - 2, "✕", "dim")));
    html.push(row(1, flash(t, phase[1], text + 6, phase[0].length) +
      seg(text, "DeLM", "blue bold") + seg(text + 6, phase[0], "dim")));

    html.push(row(3, seg(text, "AGENTS", "dim")));
    agents.forEach((agent, index) => {
      const label = agent.task ? `#${agent.task} ${taskTitle(agent.task)}` : agent.label;
      const content = agent.task
        ? seg(text, `${index + 1}  ${label}`, "bright bold") + seg(text + 3 + label.length, " · Working", "blue")
        : seg(text, `${index + 1}`, "bright bold") + seg(text + 3, label, "dim");
      html.push(row(4 + index, flash(t, agent.since, text + 3, label.length + (agent.task ? 10 : 0)) + content));
    });

    html.push(row(7, seg(text, "TASK QUEUE", "dim")));
    if (!tasks.length) html.push(row(8, seg(text, "No tasks shared yet", "dim")));
    tasks.forEach((item, index) => {
      html.push(row(8 + index, flash(t, item.since, text + 26, item.status.length) +
        seg(text, `#${item.id}`, "dim") + seg(text + 4, taskTitle(item.id)) +
        seg(text + 26, item.status, item.status === "Available" ? "dim" : ""), fadeIn(t, board.tasks)));
    });
    html.push(row(sharedHeader, seg(text, "SHARED CONTEXT", "dim")));
    if (!shared.length) html.push(row(sharedHeader + 1, seg(text, "No findings or code shared yet", "dim")));
    shared.forEach((entry, index) => {
      const top = sharedHeader + 1 + index * 5, style = fadeIn(t, entry.at);
      const age = Math.max(1, Math.floor(t - entry.at));
      html.push(row(top, flash(t, entry.at, text, entry.title.length) + seg(text, entry.title, "bright bold"), style));
      html.push(row(top + 1, seg(text, `Agent ${entry.author} published · ${age}s ago`, "dim"), style));
      html.push(row(top + 2, seg(text, entry.body), style));
      if (t >= entry.import) {
        const imported = `Agent ${3 - entry.author} imported this contribution.`;
        html.push(row(top + 3, flash(t, entry.import, text, imported.length) + seg(text, imported, "blue"), fadeIn(t, entry.import)));
      }
    });
    html.push(row(24, seg(text, "d", "key") + seg(text + 1, ": Details") + seg(text + 13, "h", "key") + seg(text + 14, ": Hide")));
    boardRows.innerHTML = html.join("");
  }

  // Agent panes: the current task, the latest tool call, its code, and a live preview.
  const panes = [1, 2].map((agent) => {
    const element = $(`#agent-${agent}`);
    const label = document.createElement("div");
    label.className = "preview-label";
    element.querySelector(".agent-preview").prepend(label);
    return { agent, rows: element.querySelector(".agent-rows"), label };
  });
  const PREVIEW_LABELS = {
    1: [[0, "Movement"], [25.9, "Jump controls"], [27.3, "Movement + obstacles"]],
    2: [[0, "Drums · 140 BPM"], [25.2, "Drums + bass"], [27.7, "Soundtrack · 140 BPM"]],
  };

  function agentPane({ agent, rows: target, label }, t) {
    const view = {};
    let code = null, tool = null;
    for (const beat of T.agents[agent]) {
      if (t < beat.at) break;
      if (beat.detail) Object.assign(view, { detail: beat.detail, since: beat.at });
      if (beat.tool) tool = beat;
      if (beat.code) code = beat;
    }
    const state = agentState(agent, t);
    const status = state.task ? ["Working", "blue"] : [state.label, "dim"];
    const html = [row(0, seg(0, `Agent ${agent}`, "bright bold") + seg(PANE_COLUMNS - status[0].length, status[0], status[1]))];
    const task = state.task || state.last;
    html.push(row(1, task ? seg(0, `#${task} ${taskTitle(task)}`, state.task ? "" : "dim") : seg(0, "Reading the task queue", "dim")));
    if (tool) {
      html.push(row(2, flash(t, tool.at, 0, tool.tool.length + tool.file.length + 4) +
        seg(0, "⏺", "ok") + seg(2, tool.tool, "bright bold") + seg(2 + tool.tool.length, `(${tool.file})`)));
    }
    if (code) {
      const progress = code.type ? clamp((t - code.at) / code.type) : 1;
      const total = code.code.join("").length;
      let shown = Math.floor(total * progress);
      const tone = code.tone === "ok" ? "ok" : code.tone === "bad" ? "bad" : "";
      code.code.forEach((text, index) => {
        const visible = text.slice(0, Math.max(0, shown));
        shown -= text.length;
        const background = tone === "bad" ? "rgba(255, 107, 107, .16)" : tone === "ok" ? "rgba(78, 186, 101, .16)" : "rgba(78, 186, 101, .13)";
        html.push(row(3 + index, (index ? "" : seg(2, "⎿", "dim")) +
          (visible ? fill(5, visible.length + 1, background) : "") + seg(5, visible, tone)));
      });
    }
    if (view.detail) html.push(row(5, flash(t, view.since, 0, view.detail.length) + seg(0, view.detail, "dim")));
    target.innerHTML = html.join("");
    label.textContent = PREVIEW_LABELS[agent].filter(([at]) => t >= at).at(-1)[1];
  }

  // Route geometry in Claude Code screen pixels. Each agent has its own track.
  const rowCenter = (index) => 18 + index * LINE + LINE / 2;
  const TRACK = { 1: { x: 922, y: 305, pane: 251 }, 2: { x: 934, y: 319, pane: 697 } };
  const PANE_TOP = 326, BOARD_TEXT = 966;
  routeLayer.innerHTML = `<defs><radialGradient id="route-glow"><stop offset="0" stop-color="#6b8fff" stop-opacity=".55"/><stop offset="1" stop-color="#6b8fff" stop-opacity="0"/></radialGradient></defs><g id="route-items"></g>`;
  const routeItems = routeLayer.querySelector("#route-items");

  function routePoints(route) {
    const track = TRACK[route.agent];
    const toBoard = route.kind === "share";
    const layout = boardLayout(toBoard ? route.end : route.at);
    const boardRow = route.task ? layout.taskRow[route.task] : layout.sharedRow[route.share];
    const y = rowCenter(boardRow);
    const points = [[track.pane, PANE_TOP], [track.pane, track.y], [track.x, track.y], [track.x, y], [BOARD_TEXT, y]];
    return toBoard ? points : points.reverse();
  }

  function pointAt(points, distance) {
    for (let index = 1; index < points.length; index++) {
      const [ax, ay] = points[index - 1], [bx, by] = points[index];
      const length = Math.hypot(bx - ax, by - ay);
      if (distance <= length) return [ax + (bx - ax) * distance / length, ay + (by - ay) * distance / length];
      distance -= length;
    }
    return points.at(-1);
  }

  function routesAt(t) {
    const html = [];
    for (const route of routes) {
      const linger = .4;
      if (t < route.at || t > route.end + linger) continue;
      const points = routePoints(route);
      const length = points.slice(1).reduce((sum, [x, y], index) => sum + Math.hypot(x - points[index][0], y - points[index][1]), 0);
      const p = clamp((t - route.at) / (route.end - route.at)), eased = p * p * (3 - 2 * p);
      const opacity = t > route.end ? 1 - (t - route.end) / linger : Math.min(1, p * 8);
      const [x, y] = pointAt(points, eased * length);
      const track = TRACK[route.agent], word = route.label;
      const labelX = (track.pane + track.x) / 2, labelWidth = word.length * 9.2 + 28;
      html.push(`<g opacity="${opacity.toFixed(3)}">` +
        `<polyline points="${points.map((point) => point.join(",")).join(" ")}" fill="none" stroke="#6b8fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${length.toFixed(1)}" stroke-dashoffset="${((1 - eased) * length).toFixed(1)}"/>` +
        `<g class="route-label" transform="translate(${labelX} ${track.y})"><rect x="${-labelWidth / 2}" y="-14" width="${labelWidth}" height="28" rx="14"/><text text-anchor="middle" dominant-baseline="central">${word}</text></g>` +
        `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="18" fill="url(#route-glow)"/>` +
        `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><path d="M-8-11H3L8-6V11H-8Z" fill="#eef2ff" stroke="#6b8fff" stroke-width="1.6"/><path d="M3-11V-6H8M-4 0H4M-4 5H4" fill="none" stroke="#6b8fff" stroke-width="1.4"/></g>` +
        `</g>`);
    }
    routeItems.innerHTML = html.join("");
  }

  window.DELM_CLAUDE = Object.freeze({
    render(t) {
      claudeRows(t);
      boardRowsAt(t);
      for (const pane of panes) agentPane(pane, t);
      routesAt(t);
      window.DELM_FEATURES.draw(14 + (t - T.agents.features));
    },
  });
})();

</script>
    <script>
(() => {
  const tl = gsap.timeline({ paused: true });
  const smooth = "power3.inOut";
  const reveal = "power3.out";
  const $ = (selector) => document.querySelector(selector);
  const $$ = (selector) => [...document.querySelectorAll(selector)];
  const T = DELM_TIMING, film = DELM_FILM;
  const typing = Object.fromEntries(DELM_TYPING.map((field) => [field.name, field]));
  const clamp = (value) => Math.max(0, Math.min(1, value));
  const progress = (time, start, duration) => clamp((time - start) / duration);
  const easeInOut = (p) => p < .5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2;
  const smoothstep = (p) => p * p * (3 - 2 * p);
  const typed = (name, t) => {
    const field = typing[name];
    return field.text.slice(0, field.times.filter((at) => at <= t).length);
  };
  const escape = (text) => String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  $(".copy-command").textContent = film.installer;

  // Window geometry: a compact installer terminal, then a full Claude Code window.
  const INSTALL_WINDOW = { width: 1280, height: 700 };
  const CLAUDE_WINDOW = { left: 96, top: 80, width: 1728, height: 920 };
  const BAR = 44;
  const windowEase = gsap.parseEase(smooth);
  // The close framing keeps the whole Claude Code window in view, edge to edge.
  const AGENTS = { scale: 1.09, x: -86.4, y: -48.6 };

  const show = (selector, start, duration = .5) =>
    tl.fromTo(selector, { opacity: 0 }, { opacity: 1, duration, ease: reveal }, start);
  // Explicit start values keep every frame identical however the renderer seeks.
  const hide = (selector, start, duration = .4) =>
    tl.fromTo(selector, { opacity: 1 }, { opacity: 0, duration, ease: "power2.in", immediateRender: false }, start);
  const enter = (selector, start, y = 24, duration = .65) =>
    tl.fromTo(selector, { opacity: 0, y }, { opacity: 1, y: 0, duration, ease: reveal }, start);

  // Title
  tl.to("#cover", { y: -18, opacity: 0, duration: .35, ease: smooth }, T.title.out);

  // Installation in a terminal that settles square before typing begins.
  tl.fromTo("#term-rig", { y: 36 }, { y: 0, duration: 1.05, ease: reveal }, T.install.window_in);
  tl.fromTo("#term-rig", { opacity: 0 }, { opacity: 1, duration: .3, ease: "power1.out" }, T.install.window_in);
  tl.fromTo("#term", { rotationX: 1.5, rotationY: -2 }, { rotationX: 0, rotationY: 0, duration: 1.05, ease: "power2.out" }, T.install.window_in);
  enter("#opening-title", T.install.window_in + .12, 28, .85);

  // The same window grows into Claude Code.
  const launch = T.claude.expand;
  tl.to("#opening-title", { y: -80, opacity: 0, duration: .72, ease: smooth }, launch);
  tl.to("#term-rig", { ...CLAUDE_WINDOW, duration: T.claude.expand_duration, ease: smooth }, launch);
  tl.to("#install-screen", { opacity: 0, y: -24, duration: .3, ease: smooth }, launch + .05);
  show("#claude-screen", T.claude.screen, .35);

  // Hold on the board, then move in as both agents appear beside it.
  tl.to("#camera", { ...AGENTS, duration: T.camera.push[1], ease: smooth }, T.camera.push[0]);
  tl.fromTo(".agent", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .6, ease: reveal, stagger: .14 }, T.agents.in);
  tl.to(".agent", { opacity: 0, y: -10, duration: .45, ease: "power2.in" }, T.agents.out);

  // The result: the camera pushes into Claude's message and the game opens out of it.
  const R = T.result;
  // Zoom in place on the message so the terminal always covers the frame.
  const MESSAGE_POINT = [573, 478];
  const onScreen = [MESSAGE_POINT[0] * AGENTS.scale + AGENTS.x, MESSAGE_POINT[1] * AGENTS.scale + AGENTS.y];
  const ZOOM = { scale: 1.6, x: onScreen[0] - MESSAGE_POINT[0] * 1.6, y: onScreen[1] - MESSAGE_POINT[1] * 1.6 };
  // The game grows out of the message's position on screen (#game sits at 80, 45).
  const gameOrigin = `${(onScreen[0] - 80).toFixed(1)}px ${(onScreen[1] - 45).toFixed(1)}px`;
  tl.to("#camera", { ...ZOOM, duration: R.zoom[1], ease: "power2.in" }, R.zoom[0]);
  tl.fromTo("#game-backdrop", { opacity: 0 }, { opacity: 1, duration: .45, ease: "power1.in" }, R.game - .25);
  tl.set("#camera", { opacity: 0 }, R.game + .3);
  tl.fromTo("#game", { scale: .16, opacity: 0, transformOrigin: gameOrigin },
    { scale: 1, opacity: 1, duration: .9, ease: "expo.out", transformOrigin: gameOrigin }, R.game);
  tl.fromTo("#pointer", { x: 620, y: 880, opacity: 0 },
    { x: 398, y: 675, opacity: 1, duration: .45, ease: smooth, immediateRender: false }, R.play_click - .55);
  tl.to("#pointer", { scale: .85, duration: .08 }, R.play_click).to("#pointer", { scale: 1, duration: .16 }, R.play_click + .08);
  hide("#pointer", R.play_click + .3, .3);
  tl.fromTo("#callout-1", { opacity: 0, y: 16, scale: .9, xPercent: -50 },
    { opacity: 1, y: 0, scale: 1, xPercent: -50, duration: .5, ease: "back.out(1.8)", transformOrigin: "50% 0%" }, R.callouts[0]);
  tl.fromTo("#callout-2", { opacity: 0, y: 16, scale: .9 },
    { opacity: 1, y: 0, scale: 1, duration: .5, ease: "back.out(1.8)", transformOrigin: "88% 0%" }, R.callouts[1]);
  // Everything leaves before the footage ends, then the night gives way to the paper.
  hide("#callout-1", R.exit - .1, .3);
  hide("#callout-2", R.exit - .1, .3);
  tl.fromTo("#game", { scale: 1, opacity: 1, transformOrigin: "50% 50%" },
    { scale: .94, opacity: 0, duration: .55, ease: "power2.in", transformOrigin: "50% 50%", immediateRender: false }, R.exit);
  hide("#game-backdrop", R.exit + .2, .6);

  // Closing: the original choreography, then both mascots hop onto the command.
  const C = T.closing;
  show("#closing", C.in, .4);
  enter("#closing-title .closing-line", C.title, 24, .7);
  enter("#closing-command", C.command, 14, .55);
  tl.fromTo("#closing-clawd", { opacity: 0, y: 26, scale: .55 },
    { opacity: 1, y: 0, scale: 1, duration: .5, ease: "back.out(2.2)", transformOrigin: "50% 100%" }, C.mascots);
  tl.fromTo("#closing-codex", { opacity: 0, y: 26, scale: .55 },
    { opacity: 1, y: 0, scale: 1, duration: .5, ease: "back.out(2.2)", transformOrigin: "50% 100%" }, C.mascots + .16);
  tl.to({}, { duration: T.duration }, 0);

  // Installation transcript. Lines appear as the installer prints them.
  const I = T.install;
  const caret = '<b class="typed-caret"></b>';
  const shell = (name, caretUntil) => (t) =>
    `<span class="path">${escape(film.project)}</span> <span class="prompt-symbol">$</span> ${escape(typed(name, t))}` +
    (t < caretUntil && (t >= typing[name].times[0] || Math.floor(t * 2.3) % 2 === 0) ? caret : "");
  const SPINNER = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";
  const install = (host, [start, done]) => (t) => t < done
    ? `<span class="spin">${SPINNER[Math.floor(t * 12) % SPINNER.length]}</span> Installing DeLM in ${host}…`
    : `<span class="ok">✓</span> Installed DeLM in ${host}`;
  const logo = [" ____       _     __  __", "|  _ \\  ___| |   |  \\/  |", "| | | |/ _ \\ |   | |\\/| |", "| |_| |  __/ |___| |  | |", "|____/ \\___|_____|_|  |_|"];
  const installLines = [
    { at: I.window_in + .5, html: shell("installer", I.enter) },
    ...logo.map((text, index) => ({ at: I.logo + index * .03, html: escape(text), cls: "logo" })),
    { at: I.logo + .16, html: "" },
    { at: I.menu, html: "Choose where to manage DeLM:" },
    { at: I.menu + .03, html: "  1. Codex" },
    { at: I.menu + .05, html: "  2. Claude Code" },
    { at: I.menu + .07, html: "  3. Both" },
    { at: I.menu + .07, html: "" },
    { at: I.menu + .1, html: (t) => `Choose 1, 2, or 3: ${escape(typed("choice", t))}` + (t < I.choice_enter ? caret : "") },
    { at: I.claude[0], html: install("Claude Code", I.claude) },
    { at: I.codex[0], html: install("Codex", I.codex) },
    { at: I.ready, html: "" },
    { at: I.ready, html: '<span class="brand">DeLM</span> <span class="ready">is ready in Claude Code and Codex.</span>' },
    { at: I.shell, html: shell("launch", I.launch_enter + 1) },
  ];
  const installContainer = $("#install-lines");
  installContainer.innerHTML = installLines.map((line) => `<div class="install-line ${line.cls || ""}"></div>`).join("");
  const installElements = [...installContainer.children];

  function updateInstall(t) {
    installLines.forEach((line, index) => {
      const element = installElements[index];
      const visible = t >= line.at;
      element.style.display = visible ? "block" : "none";
      if (!visible) return;
      const html = typeof line.html === "function" ? line.html(t) : line.html;
      if (element.innerHTML !== html) element.innerHTML = html;
    });
    $("#term-caption").textContent = t < T.claude.expand ? "neon-rush — -zsh" : "neon-rush — claude";
  }

  // The host name turns once, upward, from Claude Code to Codex.
  // Rendered widths of each name and mascot in Geist 112 px; #host-slot uses the wider one.
  const HOST_WIDTHS = { claude: 810, codex: 466 };
  const title = $("#cover-title"), claudeHost = $("#host-claude"), codexHost = $("#host-codex");
  // Extra room on the right lets a raised arm wave without being clipped;
  // the matching negative margin keeps the title centered on the names.
  const WAVE_ROOM = 48;
  $("#host-slot").style.width = `${HOST_WIDTHS.claude + WAVE_ROOM}px`;
  $("#host-slot").style.marginRight = `${-WAVE_ROOM}px`;
  function updateTitle(t) {
    const p = progress(t, T.title.roll, T.title.roll_duration);
    // A wheel accelerates, passes its stop slightly, and settles.
    const turn = easeInOut(p) + .045 * Math.sin(Math.PI * clamp((p - .55) / .45));
    const height = 200;
    claudeHost.style.transform = `translateY(${(-turn * height).toFixed(2)}px)`;
    codexHost.style.transform = `translateY(${((1 - turn) * height).toFixed(2)}px)`;
    const blur = (Math.sin(Math.PI * p) * 2.4).toFixed(2);
    claudeHost.style.filter = codexHost.style.filter = `blur(${blur}px)`;
    const width = HOST_WIDTHS.claude + (HOST_WIDTHS.codex - HOST_WIDTHS.claude) * easeInOut(p);
    title.style.transform = `translateX(${((HOST_WIDTHS.claude - width) / 2).toFixed(2)}px)`;
  }

  // Mascots wave, blink, and breathe on the film clock.
  const M = C.mascots;
  const mascots = [
    { root: "#host-claude", arm: -55, swing: 16, rate: 1.6, length: 1.08, wave: T.title.clawd_wave, blinks: [1.15], phase: 0 },
    { root: "#host-codex", arm: -120, swing: 18, rate: 2.4, length: 1.35, wave: T.title.codex_wave, blinks: [2.95], phase: 1.3 },
    { root: "#closing-clawd", arm: -55, swing: 16, rate: 1.6, length: 1.7, wave: M + .55, blinks: [M + 2.1, M + 3.5], phase: .4 },
    { root: "#closing-codex", arm: -120, swing: 18, rate: 2.4, length: 1.35, wave: M + .75, blinks: [M + 2.6], phase: 1.9 },
  ].map((mascot) => ({
    ...mascot,
    arms: $$(`${mascot.root} .clawd-wave-arm, ${mascot.root} .codex-wave-arm`),
    front: $(`${mascot.root} .clawd-wave-front, ${mascot.root} .codex-wave-front`),
    rest: $$(`${mascot.root} .clawd-wave-rest, ${mascot.root} .codex-wave-rest`),
    eyes: $(`${mascot.root} .clawd-eyes, ${mascot.root} .codex-eyes`),
    figure: $(`${mascot.root} .clawd-figure, ${mascot.root} .codex-figure`),
  }));
  function updateMascots(t) {
    for (const mascot of mascots) {
      const p = (t - mascot.wave) / mascot.length;
      const envelope = p < 0 || p > 1 ? 0 : smoothstep(clamp(p / .2)) * smoothstep(clamp((1 - p) / .2));
      const swing = mascot.swing * Math.sin((t - mascot.wave) * Math.PI * 2 * mascot.rate);
      // Each arm swings up from its shoulder and stays attached.
      const transform = `rotate(${(envelope * (mascot.arm + swing)).toFixed(2)}deg)`;
      for (const arm of mascot.arms) arm.style.transform = transform;
      const raised = envelope >= .3;
      mascot.front.setAttribute("opacity", raised ? "1" : "0");
      mascot.rest.forEach((rest) => rest.setAttribute("opacity", raised ? "0" : "1"));
      const blinking = mascot.blinks.some((at) => t >= at && t < at + .13);
      mascot.eyes.style.transform = blinking ? "scaleY(.12)" : "";
      const bob = Math.sin(t * Math.PI * 1.6 + mascot.phase) * 1.6;
      mascot.figure.style.transform = `translateY(${bob.toFixed(2)}px)`;
    }
  }

  // Claude Code draws at full size and scales with the window while it grows.
  const claudeScreen = $("#claude-screen");
  function updateWindow(t) {
    const p = windowEase(progress(t, T.claude.expand, T.claude.expand_duration));
    const width = INSTALL_WINDOW.width + (CLAUDE_WINDOW.width - INSTALL_WINDOW.width) * p;
    const height = INSTALL_WINDOW.height + (CLAUDE_WINDOW.height - INSTALL_WINDOW.height) * p;
    const scale = Math.min(1, width / CLAUDE_WINDOW.width, (height - BAR) / (CLAUDE_WINDOW.height - BAR));
    claudeScreen.style.transform = scale < 1 ? `scale(${scale.toFixed(4)})` : "";
  }

  // The board slides in from the right edge of the window as it opens.
  const boardPanel = $("#board");
  function updateBoard(t) {
    const p = 1 - (1 - progress(t, T.board.open, .45)) ** 3;
    boardPanel.style.opacity = p.toFixed(3);
    boardPanel.style.transform = p < 1 ? `translateX(${((1 - p) * 60).toFixed(2)}px)` : "";
  }

  function updateClosing(t) {
    const closing = typing.closing;
    const count = closing.times.filter((at) => at <= t).length;
    const text = closing.text.slice(0, count);
    $("#closing-with-fast").textContent = text.slice(0, 7);
    $("#closing-with-prefix").textContent = text.slice(7, 12);
    $("#closing-with-brand").textContent = text.slice(12);
    $("#closing-with-caret").style.display = t >= closing.times[0] - .05 && count < closing.text.length ? "inline-block" : "none";
    $(".closing-caret").style.opacity = Math.floor(t * 1.7) % 2 ? "1" : "0";
  }

  function update() {
    const t = tl.time();
    updateTitle(t);
    updateMascots(t);
    updateInstall(t);
    updateWindow(t);
    window.DELM_CLAUDE.render(t);
    updateBoard(t);
    updateClosing(t);
  }
  tl.eventCallback("onUpdate", update);
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
  window.DELM_SEEK = (time) => {
    tl.seek(time, false);
    update();
  };
  update();
})();

</script>
  </body>
</html>
