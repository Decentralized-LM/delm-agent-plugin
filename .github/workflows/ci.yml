name: Verify
on:
  push:
    branches-ignore: [marketplace]
    tags-ignore: ['delm-plugin-*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Check the installer and its npm package
        run: npm --prefix packages/installer test
  plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            codex: '0.160.1'
            claude: '2.1.289'
          - runner: macos-15-intel
            codex: '0.160.1'
            claude: '2.1.289'
          - runner: macos-15
            codex: latest
            claude: latest
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install native hosts for compatibility checks
        env:
          CODEX_VERSION: ${{ matrix.codex }}
          CLAUDE_VERSION: ${{ matrix.claude }}
        run: npm install --global "@openai/codex@$CODEX_VERSION" "@anthropic-ai/claude-code@$CLAUDE_VERSION"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Check runtime and native plugin installation
        run: ./scripts/verify.sh
      - name: Build both native plugin bundles and validate the Claude payload
        run: ./scripts/build.sh --host all
      - name: Verify the packed npm installer with native Codex
        run: npm --prefix packages/installer run test:native
      - name: Verify native Claude distribution without account or model access
        run: npm --prefix packages/installer run test:native:claude
      - name: Verify native configuration inheritance without model calls
        run: DELM_TEST_HOST="$(command -v codex)" cargo test --locked --test native_inheritance -- --ignored
      - name: Verify production Codex startup, delivery and failure recovery without model calls
        run: |
          python3 -B scripts/test_verify_codex_startup.py
          for scenario in scripted failure; do
            python3 -B scripts/verify_codex_startup.py --runtime target/debug/delm --case "$scenario" --out "$RUNNER_TEMP/delm-startup/$scenario"
          done
      - name: Retain native Codex startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-startup-${{ matrix.runner }}-${{ matrix.codex }}
          path: ${{ runner.temp }}/delm-startup
          if-no-files-found: ignore
      - name: Verify native cancellation and lifecycle ownership without model calls
        run: |
          cargo build --locked --example native-lifecycle-fixture
          for scenario in interrupt preflight stop owner-death plugin-remove; do
            python3 scripts/verify_native_lifecycle.py --case "$scenario" --out "$RUNNER_TEMP/delm-lifecycle-$scenario"
          done
      - name: Check the example
        run: node --test examples/task-board/task.test.mjs
