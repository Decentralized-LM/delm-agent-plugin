name: Prepare macOS release
on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Source tag matching Cargo.toml, e.g. v0.3.0'
        required: true
        type: string
      publish:
        description: 'Sign, notarize, and publish to the native marketplace'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: delm-release
  cancel-in-progress: false
jobs:
  identity:
    runs-on: macos-15
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_tag }}
          persist-credentials: false
      - name: Resolve the source tag once for every release job
        id: source
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          python3 scripts/release_identity.py
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.identity.outputs.revision }}
          persist-credentials: false
      - name: Check release identity
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_SOURCE_SHA: ${{ needs.identity.outputs.revision }}
        run: python3 scripts/release_identity.py
      - name: Install build and qualification tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          npm install --global @openai/codex@0.159.3
      - name: Verify runtime and isolated native installation
        run: |
          ./scripts/verify.sh
          DELM_TEST_HOST="$(command -v codex)" cargo test --locked --test native_sandbox -- --ignored
      - name: Build native runtime
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          cargo build --locked --release --bin delm --target "$BUILD_TARGET"
          tar -cf runtime.tar -C "target/$BUILD_TARGET/release" delm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-${{ matrix.target }}
          path: runtime.tar
          if-no-files-found: error
  assemble:
    needs: [identity, build]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.identity.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: runtime-*
          path: artifacts
      - name: Assemble universal runtime and unsigned review package
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          tar -xf artifacts/runtime-aarch64-apple-darwin/runtime.tar -C artifacts/runtime-aarch64-apple-darwin
          tar -xf artifacts/runtime-x86_64-apple-darwin/runtime.tar -C artifacts/runtime-x86_64-apple-darwin
          lipo -create artifacts/runtime-aarch64-apple-darwin/delm artifacts/runtime-x86_64-apple-darwin/delm -output artifacts/delm
          lipo -verify_arch arm64 x86_64 artifacts/delm
          python3 scripts/package_release.py --runtime artifacts/delm --output unsigned-review --repository "$RELEASE_REPOSITORY" --revision "$(git rev-parse HEAD)"
          tar -cf unsigned-macos-review.tar -C unsigned-review .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-macos-review-not-for-distribution
          path: unsigned-macos-review.tar
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: [identity, assemble]
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.identity.outputs.revision }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-macos-review-not-for-distribution
      - name: Sign and notarize; fail if credentials or assessment are missing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: bash scripts/sign_release.sh
      - name: Publish immutable package tag and marketplace branch atomically
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          RELEASE_SOURCE_SHA: ${{ needs.identity.outputs.revision }}
        run: python3 scripts/publish_release.py signed-release
