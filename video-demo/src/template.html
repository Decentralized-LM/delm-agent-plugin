<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>DeLM for Claude Code and Codex</title>
    <link rel="stylesheet" href="src/film.css" />
  </head>
  <body>
    <div
      id="film"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-duration="40"
      data-fps="60"
    >
      <div class="paper"></div>

      <div id="cover">
        <div id="cover-title">
          <span class="cover-brand">DeLM</span><span class="cover-for">for</span
          ><span id="host-slot"
            ><span id="host-claude" class="host"
              ><span class="host-name">Claude Code</span><span class="pet"><!--mascot:clawd--></span></span
            ><span id="host-codex" class="host"
              ><span class="host-name">Codex</span><span class="pet"><!--mascot:codex--></span></span
            ></span
          >
        </div>
        <div id="install-copy" class="install-copy">
          <span class="copy-command"></span
          ><span class="copy-icon"
            ><svg viewBox="0 0 24 24">
              <rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V4H4v12h4" /></svg
          ></span>
        </div>
      </div>

      <div id="opening-title" class="opening-title">Build faster with <span>DeLM.</span></div>

      <div id="camera">
        <div id="term-rig">
          <div id="term" class="window">
            <div class="window-bar">
              <div class="traffic"><i></i><i></i><i></i></div>
              <span id="term-caption">neon-rush — -zsh</span><span class="bar-spacer"></span>
            </div>
            <div id="install-screen" class="term-content">
              <div id="install-lines"></div>
            </div>
            <div id="claude-screen" class="term-content">
              <div id="claude-rows"></div>
              <div id="agent-1" class="agent">
                <div class="agent-rows"></div>
                <div class="agent-preview"><canvas id="physics-preview" width="444" height="142"></canvas></div>
              </div>
              <div id="agent-2" class="agent">
                <div class="agent-rows"></div>
                <div class="agent-preview"><canvas id="audio-preview" width="444" height="142"></canvas></div>
              </div>
              <div id="board">
                <div id="board-rows"></div>
              </div>
              <svg id="routes" viewBox="0 0 1728 876" aria-hidden="true"></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- The finished game opens out of Claude's message. -->
      <div id="game-backdrop"></div>
      <div id="game">
        <video
          id="game-footage"
          src="assets/footage/neon-rush-edit.mp4"
          data-start="40"
          data-duration="6"
          data-track-index="1"
          muted
          playsinline
          preload="auto"
        ></video>
      </div>
      <div id="callout-1" class="callout"><span class="badge">1</span><span class="who">Agent 1</span> Jump physics + level</div>
      <div id="callout-2" class="callout"><span class="badge">2</span><span class="who">Agent 2</span> Synthwave soundtrack</div>

      <div id="closing" class="scene closing">
        <h1 id="closing-title"><span class="closing-line">Build your next idea.</span></h1>
        <div id="closing-with" aria-label="Faster with DeLM."><span class="closing-with-size" aria-hidden="true">Faster with DeLM.</span><span class="closing-with-text" aria-hidden="true"><span id="closing-with-fast"></span><span id="closing-with-prefix"></span><span id="closing-with-brand"></span><b id="closing-with-caret"></b></span></div>
        <div id="closing-command">
          <span>›</span> /delm:run <b class="closing-caret"></b><span id="closing-clawd" class="perched"><!--mascot:clawd--></span><span id="closing-codex" class="perched"><!--mascot:codex--></span>
        </div>
      </div>

      <svg id="pointer" viewBox="0 0 32 40" aria-hidden="true">
        <path d="M3 2L3 29L10 23L16 37L22 34L16 20L27 20Z" fill="#161a21" stroke="white" stroke-width="2.5" stroke-linejoin="round" />
      </svg>
      <audio
        id="interface-sound"
        src="assets/audio/demo-soundtrack.wav"
        data-start="0"
        data-duration="52"
        data-track-index="2"
      ></audio>
    </div>
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <script src="src/content.js"></script>
    <script src="src/features.js"></script>
    <script src="src/claude.js"></script>
    <script src="src/film.js"></script>
  </body>
</html>
