[package]
name = "delm"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Parallel agent collaboration for Codex and Claude Code"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "native-lifecycle-fixture"
path = "tests/fixtures/native_lifecycle.rs"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = "debuginfo"
