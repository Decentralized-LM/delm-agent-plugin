name: Verify
on:
  push:
    branches-ignore: [marketplace]
    tags-ignore: ['delm-plugin-*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            codex: '0.159.2'
          - runner: macos-15-intel
            codex: '0.159.3'
          - runner: macos-15
            codex: latest
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install stock Codex for compatibility checks
        env:
          CODEX_VERSION: ${{ matrix.codex }}
        run: npm install --global "@openai/codex@$CODEX_VERSION"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Check runtime and native plugin installation
        run: ./scripts/verify.sh
      - name: Build the plugin bundle
        run: ./scripts/build.sh
      - name: Verify private development environments without model calls
        run: DELM_TEST_HOST="$(command -v codex)" cargo test --locked --test native_sandbox -- --ignored
      - name: Check the example
        run: node --test examples/task-board/task.test.mjs
